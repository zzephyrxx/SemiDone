<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SemiDone V7 · 第一版审阅</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #eaeaf0; color: #30313e; font: 13px 'Segoe UI', 'Microsoft YaHei UI', sans-serif; }
    header { position: sticky; top: 0; z-index: 1; padding: 18px 22px; background: #f8f8fc; border-bottom: 1px solid #dcdde6; }
    .heading { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 13px; }
    h1 { font-size: 15px; margin: 0; font-weight: 600; }
    .tag { font-size: 10px; padding: 3px 7px; border-radius: 6px; color: #515fa8; background: #e8ebfa; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; }
    button, a { padding: 7px 11px; border-radius: 8px; border: 1px solid #d7d9e5; background: white; color: #55596c; font: inherit; text-decoration: none; cursor: pointer; }
    button[aria-pressed='true'] { background: #545fae; color: white; border-color: #545fae; }
    button:focus-visible, a:focus-visible { outline: 2px solid #545fae; outline-offset: 3px; }
    .divider { width: 1px; height: 22px; background: #d7d9e5; margin: 0 3px; }
    p { margin: 11px 0 0; color: #747888; font-size: 11px; line-height: 1.6; }
    main { padding: 24px; overflow: auto; }
    .viewport { width: 550px; height: 900px; margin: 0 auto; border-radius: 18px; overflow: hidden; outline: 1px solid #d4d5e0; box-shadow: 0 8px 40px #30313e12; background: white; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #dimensions { color: #747888; font-size: 11px; margin-left: 4px; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <header>
    <div class="heading"><h1>SemiDone · V7 外观原型</h1><span class="tag">第一版</span></div>
    <div class="controls">
      <button type="button" data-width="400" data-height="700" aria-pressed="false">最小窗口</button>
      <button type="button" data-width="550" data-height="900" aria-pressed="true">日常窄窗</button>
      <button type="button" data-width="1040" data-height="800" aria-pressed="false">宽屏侧栏</button>
      <span class="divider"></span>
      <button type="button" data-page="/" aria-pressed="true">首页</button>
      <button type="button" data-page="/settings" aria-pressed="false">设置</button>
      <a href="/" target="_blank" rel="noopener">独立打开 ↗</a>
      <span id="dimensions">550 × 900</span>
    </div>
    <p>可在设置中切换明亮、深色、梦粉及可选玻璃。这里使用浏览器演示数据，与桌面端数据独立；置顶、自启和窗口形态需在桌面端验证。</p>
  </header>
  <main><div class="viewport" id="viewport"><iframe id="app" title="SemiDone 可交互原型" src="/"></iframe></div></main>
  <script>
    const viewport = document.getElementById('viewport');
    const app = document.getElementById('app');
    document.querySelectorAll('[data-width]').forEach(button => {
      button.addEventListener('click', () => {
        viewport.style.width = button.dataset.width + 'px';
        viewport.style.height = button.dataset.height + 'px';
        document.getElementById('dimensions').textContent = button.dataset.width + ' × ' + button.dataset.height;
        document.querySelectorAll('[data-width]').forEach(item => item.setAttribute('aria-pressed', String(item === button)));
      });
    });
    document.querySelectorAll('[data-page]').forEach(button => {
      button.addEventListener('click', () => { app.src = button.dataset.page; });
    });
    app.addEventListener('load', () => {
      const path = app.contentWindow.location.pathname;
      document.querySelectorAll('[data-page]').forEach(item => item.setAttribute('aria-pressed', String(item.dataset.page === path)));
    });
  </script>
</body>
</html>
