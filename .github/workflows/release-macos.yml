name: macOS Apple silicon release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e "const v = require('./package.json').version; if (process.env.RELEASE_TAG !== 'v' + v) throw new Error('Release tag must match package.json version: v' + v)"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build:mac
      - uses: actions/upload-artifact@v4
        with:
          name: SemiDone-macOS-Apple-silicon
          path: release/macos/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SemiDone-macOS-Apple-silicon
          path: packages
      - name: Prepare a draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "SemiDone $RELEASE_TAG" --notes "macOS 26+ / Apple silicon 测试版。当前为本地临时签名，尚未完成 Apple Developer ID 签名与公证。"
          fi
          gh release upload "$RELEASE_TAG" packages/*
